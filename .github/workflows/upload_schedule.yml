name: Automated YouTube Upload Schedule

on:
  schedule:
    # 1. Subah 4:30 AM PKT (Video) -> 23:30 UTC
    - cron: '30 23 * * *'
    # 2. Subah 6:30 AM PKT (Short 1) -> 01:30 UTC
    - cron: '30 1 * * *'
    # 3. Shaam 5:30 PM PKT (Video) -> 12:30 UTC
    - cron: '30 12 * * *'
    # 4. Shaam 6:30 PM PKT (Short 2) -> 13:30 UTC
    - cron: '30 13 * * *'
  
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Choose upload mode'
        required: true
        default: 'manual_short'
        type: choice
        options:
          - manual_short
          - video_morning
          - video_evening
          - short_1
          - short_2

jobs:
  upload-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Cookies File from Secret
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Run Script Based on Schedule or Manual Trigger
        env:
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export UPLOAD_MODE="${{ github.event.inputs.run_mode }}"
          else
            CURRENT_HOUR=$(date -u +%H)
            if [ "$CURRENT_HOUR" = "23" ]; then
              export UPLOAD_MODE="video_morning"
            elif [ "$CURRENT_HOUR" = "1" ]; then
              export UPLOAD_MODE="short_1"
            elif [ "$CURRENT_HOUR" = "12" ]; then
              export UPLOAD_MODE="video_evening"
            elif [ "$CURRENT_HOUR" = "13" ]; then
              export UPLOAD_MODE="short_2"
            fi
          fi
          
          echo "Running mode: $UPLOAD_MODE"
          python main.py
